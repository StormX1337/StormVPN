name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stormvpn
          POSTGRES_PASSWORD: stormvpn_ci_password
          POSTGRES_DB: stormvpn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stormvpn" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://stormvpn:stormvpn_ci_password@localhost:5432/stormvpn_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, file: node-service.Dockerfile, args: 'PACKAGE=@stormvpn/api' }
          - { name: worker, file: node-service.Dockerfile, args: 'PACKAGE=@stormvpn/worker' }
          - { name: scheduler, file: node-service.Dockerfile, args: 'PACKAGE=@stormvpn/scheduler' }
          - {
              name: migrate,
              file: node-service.Dockerfile,
              args: 'PACKAGE=@stormvpn/api',
              target: migrator,
            }
          - {
              name: web,
              file: next-app.Dockerfile,
              args: "PACKAGE=@stormvpn/web\nAPP_PATH=apps/web",
            }
          - {
              name: admin,
              file: next-app.Dockerfile,
              args: "PACKAGE=@stormvpn/admin\nAPP_PATH=apps/admin",
            }
          - { name: node-agent, file: node-agent.Dockerfile, args: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          build-args: ${{ matrix.args }}
          push: false
          tags: stormvpn/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  agent-bundle:
    name: Package node agent
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/package-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stormvpn-agent
          path: dist/agent/
