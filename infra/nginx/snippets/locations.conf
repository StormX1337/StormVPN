# Shared routing: /api → API, /admin → admin app, everything else → web app.

# Prometheus metrics are scraped on the internal network only.
location = /metrics { return 404; }

location = /api/v1/ws {
  proxy_pass http://stormvpn_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

location /api/v1/auth/ {
  limit_req zone=auth burst=20 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://stormvpn_api;
}

# Stripe webhooks: bigger bursts, raw body forwarded untouched.
location = /api/v1/billing/webhook {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://stormvpn_api;
}

location /api/ {
  limit_req zone=api burst=100 nodelay;
  limit_conn perip 50;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://stormvpn_api;
}

location /health/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://stormvpn_api;
}

location /admin {
  # Optional: restrict the admin panel to office/VPN ranges.
  # include /etc/nginx/snippets/admin-allowlist.conf;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://stormvpn_admin;
}

location /_next/static/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://stormvpn_web;
  expires 1y;
  add_header Cache-Control "public, immutable";
}

location / {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://stormvpn_web;
}
