# StormVPN reverse proxy – main configuration
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Privacy: log truncated client addresses only (/24 for IPv4, /48-ish for IPv6).
  map $remote_addr $anonymized_addr {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+ $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+): $ip::;
    default 0.0.0.0;
  }
  log_format stormvpn '$anonymized_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time rid=$request_id';
  access_log /var/log/nginx/access.log stormvpn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Edge rate limiting (the API applies its own Redis based limits as well).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream stormvpn_api { server api:4000; keepalive 64; }
  upstream stormvpn_web { server web:3000; keepalive 32; }
  upstream stormvpn_admin { server admin:3001; keepalive 16; }

  include /etc/nginx/conf.d/*.conf;
}
