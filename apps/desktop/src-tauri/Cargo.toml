[package]
name = "stormvpn-desktop"
version = "1.0.0"
description = "StormVPN desktop client"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
libloading = "0.8"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
